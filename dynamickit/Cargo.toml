[package]
name = "dynamickit"
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"
description = "Making static types dynamic: one type of yours holding any of several static types (payload moved, facts recorded and checked), lifted operators and methods, and closed sets with generic visiting."

[dependencies]
dynamickit-derive = { path = "../dynamickit-derive" }

[dev-dependencies]
trybuild = "1"
uom = { version = "0.38.0", features = ["si", "f64"] }
typenum = "1"
