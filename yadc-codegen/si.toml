# A point in time. There is one line of instants, counted in uniform seconds
# from the Unix epoch (leap seconds are not modelled); an instant is read on a
# scale - a zero and a step, like a temperature - and every scale reads the
# same line, so an instant built from GPS seconds reads in Unix seconds.
[[family.quantity]]
name = "Instant"
dims = {s = 1}
kind = "Affine"
consts = [
    {name = "GPS_EPOCH", value = "UNIX_EPOCH + 315964800.0 * SECOND", doc = "The GPS epoch, 1980-01-06T00:00:00Z: 3657 days after the Unix epoch."},
    {name = "JULIAN_EPOCH", value = "UNIX_EPOCH - 2440587.5 * DAY", doc = "The zero of the Julian date: noon on 1 January 4713 BC (proleptic Julian), 2 440 587.5 days before the Unix epoch."},
    {name = "MODIFIED_JULIAN_EPOCH", value = "UNIX_EPOCH - 40587.0 * DAY", doc = "The zero of the modified Julian date, 1858-11-17T00:00:00Z: 40 587 days before the Unix epoch."},
    {name = "UNIX_SECONDS", ty = "Scale<Instant, Time>", value = "Scale(UNIX_EPOCH, SECOND)", doc = "Unix time: seconds from the Unix epoch."},
    {name = "UNIX_MILLISECONDS", ty = "Scale<Instant, Time>", value = "Scale(UNIX_EPOCH, MILLISECOND)", doc = "Unix time in milliseconds."},
