    {v = "HydraulicHorsepower", m = "746.04300000000001", s = "hp (hydraulic)", l = "hydraulic horsepower"},
]

# A gain: the logarithm of a power ratio. The bel is ten times, the decibel a
# tenth of that, and the neper e² times (1 Np = 2 / ln 10 B ≈ 8.686 dB).
# `level.rs` converts to and from a plain ratio.
[[family.quantity]]
name = "Gain"
kind = "Log"
units = [
    {v = "Bel", m = "1.0", s = "B", l = "bels"},
    {v = "Decibel", m = "0.1", s = "dB", l = "decibels"},
    {v = "Neper", m = "0.8685889638065036553", s = "Np", l = "nepers"},
]

# A power level: the logarithm of a power, so it carries power's exponents.
# Two levels differ by a gain (the exponents subtract: watts over watts) and a
# gain moves a level. Read on a scale - a zero and a step, like a temperature:
# dBW starts at one watt, dBm at one milliwatt, each step a decibel.
# `level.rs` converts to and from `Power`.
[[family.quantity]]
name = "PowerLevel"
dims = {m = 2, kg = 1, s = -3}
kind = "Log"
consts = [
    {name = "MILLIWATT_LEVEL", value = "WATT_LEVEL - 30.0 * DECIBEL", doc = "The level of one milliwatt, 0 dBm: 30 dB below a watt."},
    {name = "DBW", ty = "Scale<PowerLevel, Gain>", value = "Scale(WATT_LEVEL, DECIBEL)", doc = "Decibels-watt (dBW): decibels from one watt. A unit of `PowerLevel`; the watts are `Power::from` away."},
    {name = "DBM", ty = "Scale<PowerLevel, Gain>", value = "Scale(MILLIWATT_LEVEL, DECIBEL)", doc = "Decibels-milliwatt (dBm): decibels from one milliwatt. A unit of `PowerLevel`; the watts are `Power::from` away."},
]
units = [
    {v = "DecibelWatt",      s = "dBW", l = "decibels-watt",      by = "DBW"},
    {v = "DecibelMilliwatt", s = "dBm", l = "decibels-milliwatt", by = "DBM"},
]

