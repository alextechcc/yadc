# -- thermal ----------------------------------------------------------

[[family]]
name = "thermal"

[[family.quantity]]
name = "ThermodynamicTemperature"
dims = {K = 1}
# A temperature, in kelvins from absolute zero; the scales with another zero
# are offsets of the kelvin. The same type as a `TemperatureInterval`.
units = [
    {v = "Kelvin", m = "1.0", s = "K", l = "kelvin"},
    # 0 °C, the ice point of water: 273.15 K.
    {v = "Celsius", m = "1.0", z = "273.15", s = "°C", l = "degrees Celsius"},
    # 0 °F: 32 °F below the ice point.
    {v = "Fahrenheit", m = "5.0 / 9.0", z = "273.15 - 32.0 * 5.0 / 9.0", s = "°F", l = "degrees Fahrenheit"},
    {v = "Rankine", m = "5.0 / 9.0", s = "°R", l = "degrees Rankine"},
]

# A temperature difference: the degree Celsius is the kelvin, the degree
# Fahrenheit and the degree Rankine five ninths of it.
[[family.quantity]]
name = "TemperatureInterval"
dims = {K = 1}
units = [
    {v = "Kelvin", m = "1.0", s = "K", l = "kelvin"},
    {v = "Celsius", m = "1.0", s = "°C", l = "degrees Celsius", t = "DegreeCelsius"},
    {v = "Fahrenheit", m = "5.0 / 9.0", s = "°F", l = "degrees Fahrenheit", t = "DegreeFahrenheit"},
    {v = "Rankine", m = "5.0 / 9.0", s = "°R", l = "degrees Rankine", t = "DegreeRankine"},
]

[[family.quantity]]
name = "TemperatureCoefficient"
dims = {K = -1}
units = [
]

[[family.quantity]]
name = "TemperatureGradient"
dims = {m = -1, K = 1}
units = [
]

[[family.quantity]]
name = "HeatCapacity"
dims = {m = 2, kg = 1, s = -2, K = -1}
units = [
    # Physical constant (exact, SI defining constant), per kelvin of temperature
    # *interval*: `BOLTZMANN_CONSTANT * TemperatureInterval` is an energy.
    {v = "BoltzmannConstant", m = "1.380649e-23", s = "k", l = "Boltzmann constants"},
]

