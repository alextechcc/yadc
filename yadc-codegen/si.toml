# -- thermal ----------------------------------------------------------

[[family]]
name = "thermal"

[[family.quantity]]
name = "ThermodynamicTemperature"
dims = {K = 1}
kind = "Absolute"
# A temperature is read on a scale: steps counted from a zero. The zeros are
# defined from absolute zero and the steps; each scale is a constant,
# `Scale(zero, step)` (`CELSIUS.quantity(25.0)` builds, `CELSIUS.value(t)`
# reads), and the enum names them.
consts = [
    {name = "ICE_POINT", value = "ABSOLUTE_ZERO + 273.15 * KELVIN", doc = "0 °C, the ice point of water: 273.15 K."},
    {name = "FAHRENHEIT_ZERO", value = "ICE_POINT - 32.0 * DEGREE_FAHRENHEIT", doc = "0 °F: 32 °F below the ice point."},
    {name = "KELVIN_SCALE", ty = "Scale<ThermodynamicTemperature, TemperatureInterval>", value = "Scale(ABSOLUTE_ZERO, KELVIN)", doc = "The kelvin scale (K): kelvins from absolute zero."},
    {name = "CELSIUS", ty = "Scale<ThermodynamicTemperature, TemperatureInterval>", value = "Scale(ICE_POINT, KELVIN)", doc = "The Celsius scale (°C): kelvins from the ice point."},
    {name = "FAHRENHEIT", ty = "Scale<ThermodynamicTemperature, TemperatureInterval>", value = "Scale(FAHRENHEIT_ZERO, DEGREE_FAHRENHEIT)", doc = "The Fahrenheit scale (°F): degrees Fahrenheit from 32 °F below the ice point."},
    {name = "RANKINE", ty = "Scale<ThermodynamicTemperature, TemperatureInterval>", value = "Scale(ABSOLUTE_ZERO, DEGREE_FAHRENHEIT)", doc = "The Rankine scale (°R): degrees Fahrenheit from absolute zero."},
]
units = [
    {v = "Kelvin", s = "K", l = "kelvin", by = "KELVIN_SCALE"},
    {v = "Celsius", s = "°C", l = "degrees Celsius", by = "CELSIUS"},
    {v = "Fahrenheit", s = "°F", l = "degrees Fahrenheit", by = "FAHRENHEIT"},
    {v = "Rankine", s = "°R", l = "degrees Rankine", by = "RANKINE"},
]

# A temperature difference: the kelvin and the degree Celsius are one step,
# the degree Fahrenheit and the degree Rankine another.
[[family.quantity]]
name = "TemperatureInterval"
dims = {K = 1}
units = [
    {v = "Kelvin", m = "1.0", s = "K", l = "kelvin"},
    {v = "Celsius", s = "°C", l = "degrees Celsius", by = "KELVIN"},
    {v = "Fahrenheit", m = "5.0 / 9.0", c = "DEGREE_FAHRENHEIT", s = "°F", l = "degrees Fahrenheit"},
    {v = "Rankine", s = "°R", l = "degrees Rankine", by = "DEGREE_FAHRENHEIT"},
]

[[family.quantity]]
name = "TemperatureCoefficient"
dims = {K = -1}
units = [
