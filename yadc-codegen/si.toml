[system]
crate_name   = "yadc-si"
qty_type     = "SIQuantity"
dynqty_type  = "DynamicSIQuantity"
unit_type    = "SIUnit"
# Derived on every unit enum. `Debug` + `PartialEq` are what a runtime unit
# picker needs (compare the chosen unit, print it).
unit_derives = ["Copy", "Clone", "PartialEq", "Eq", "Hash", "Debug"]
# The coherent units printed by name rather than as products of base units:
# a force prints `N`, not `kg·m·s^-2`.
named = [
    "N", "J", "W", "Pa", "Hz", "C", "V", "F", "Ω", "S", "Wb", "T", "H",
    "sr", "lx", "kat",
]
# Hand-written modules the codegen declares but never overwrites. uom_bridge
# holds orphan-rule From impls that must live beside SIQuantity, so it
# cannot move to its own crate; this keeps its `pub mod` line across regens.
extra_modules = [
    { name = "uom_bridge", feature = "uom" },
]
family_order = [
    "mechanical",
    "angular",
    "electromagnetic",
    "thermal",
    "fluid",
    "density",
    "chemistry",
    "photometric",
    "information",
]

[dim]
# `rad` is an exponent axis: angles multiply like exponents (rad² is the
# steradian, torque is J/rad), so rad/s never mixes with Hz, nor torque with
# energy. Where a textbook silently sets rad = 1 (s = r·θ, v = ω·r, τ = r × F,
# I = m·r²), the code divides by a radian explicitly.
# A base unit per field, its symbol: the metre, the kilogram, the second,
# the ampere, the kelvin, the mole, the candela and the radian.
fields = ["m", "kg", "s", "A", "K", "mol", "cd", "rad"]

[dimensionless]  # Ratio units, always present in lib.rs.
units = [
    {v = "Ratio", m = "1.0", s = "", l = ""},
    {v = "PartPerHundred", m = "0.01", s = "parts per hundred", l = "parts per hundred"},
    {v = "Percent", m = "0.01", s = "%", l = "percent"},
    {v = "PartPerThousand", m = "0.001", s = "parts per thousand", l = "parts per thousand"},
    {v = "PerMille", m = "0.001", s = "‰", l = "per mille"},
    {v = "PartPerTenThousand", m = "1.0e-4", s = "parts per ten thousand", l = "parts per ten thousand"},
    {v = "BasisPoint", m = "1.0e-4", s = "bp", l = "basis points"},
    {v = "PartPerMillion", m = "1e-06", s = "ppm", l = "parts per million"},
    {v = "PartPerBillion", m = "1e-09", s = "ppb", l = "parts per billion"},
    {v = "PartPerTrillion", m = "1e-12", s = "ppt", l = "parts per trillion"},
    {v = "PartPerQuadrillion", m = "1e-15", s = "ppq", l = "parts per quadrillion"},
    # Levels of a ratio of powers: the bel is a power of ten, the decibel a
    # tenth of that, and the neper half a power of e (n Np is e^(2n)).
    {v = "Bel", m = "1.0", log = "10.0", per = "1.0", s = "B", l = "bels"},
    {v = "Decibel", m = "1.0", log = "10.0", per = "10.0", s = "dB", l = "decibels"},
    {v = "Neper", m = "1.0", log = "2.718281828459045", per = "0.5", s = "Np", l = "nepers"},
]

# A unit with an exact definition has it written out as its `m`, from the
# defining numbers (the inch 0.0254 m, the pound 0.45359237 kg, g₀ 9.80665
# m/s², the US gallon 231 in³, the survey foot 1200/3937 m, ...): the
# pound-force is `0.45359237 * 9.80665`, the slug `0.45359237 * 9.80665 /
# 0.3048`. A measured unit (a sidereal day, an atomic unit) has its value.

# -- mechanical ----------------------------------------------------------

