# A point in time, in uniform seconds from the Unix epoch (leap seconds are
# not modelled): the same type as a `Time`. Each other scale is a step
# counted from a zero, in seconds from the Unix epoch.
[[family.quantity]]
name = "Instant"
dims = {s = 1}
units = [
    {v = "UnixSecond", m = "1.0", s = "s Unix", l = "seconds of Unix time"},
    {v = "UnixMillisecond", m = "0.001", s = "ms Unix", l = "milliseconds of Unix time"},
    # The GPS epoch, 1980-01-06T00:00:00Z: 3657 days after the Unix epoch.
    {v = "GpsSecond", m = "1.0", z = "315964800.0", s = "s GPS", l = "seconds of GPS time"},
    # Noon on 1 January 4713 BC (proleptic Julian): 2 440 587.5 days before the Unix epoch.
    {v = "JulianDate", m = "86400.0", z = "-2440587.5 * 86400.0", s = "JD", l = "Julian date"},
    # 1858-11-17T00:00:00Z: 40 587 days before the Unix epoch.
    {v = "ModifiedJulianDate", m = "86400.0", z = "-40587.0 * 86400.0", s = "MJD", l = "modified Julian date"},
]

