[system]
crate_name   = "yadc-si"
dim_type     = "ISQ"
qty_type     = "SIQuantity"
dynqty_type  = "DynamicSIQuantity"
# Derived on every unit enum. `Debug` + `PartialEq` are what a runtime unit
# picker needs (compare the chosen unit, print it).
unit_derives = ["Copy", "Clone", "PartialEq", "Eq", "Hash", "Debug"]
# Hand-written modules the codegen declares but never overwrites. uom_bridge
# holds orphan-rule From impls that must live beside SIQuantity, so it
# cannot move to its own crate; this keeps its `pub mod` line across regens.
# level holds the Power <-> PowerLevel and ratio <-> Gain conversions (a
# logarithm), which are maths, not data.
extra_modules = [
    { name = "level", feature = "mechanical" },
    { name = "uom_bridge", feature = "uom" },
]
family_order = [
    "mechanical",
    "angular",
    "electromagnetic",
    "thermal",
    "fluid",
    "density",
    "chemistry",
    "photometric",
    "information",
]

[kind]
# The kinds: how a quantity behaves under `+` and `-`, beside its exponents.
#
# - `Linear` (`#[default]`): an ordinary amount. It adds to its own kind,
#   scales and multiplies.
# - `Absolute`: an amount with a true zero that is also read on scales with
#   other zeros - a temperature (kelvins, °C, °F). It scales and multiplies
#   as an amount does (`n * R * t`, an average), but two of them differ by a
#   linear amount and a linear amount moves one, so a scale with a zero never
#   reads a difference. A label marked `absolute`, whose three rules say so.
# - `Affine`: a point, measured from a zero somebody chose - an instant, in
#   seconds from an epoch. Two points of one dimension differ by a linear
#   amount and an amount moves a point; a point has no sum with another, no
#   scaling and no products. Which zero is not in the type: every scale of
#   instants (Unix seconds, Julian days) reads the same line.
# - `Log`: a logarithm - a level or a gain, in decibels. Adding logarithms
#   multiplies what they are the logarithms of, so `+` and `-` add and subtract
#   the exponents: a power level less a power level is the logarithm of a plain
#   ratio (a gain), and a gain moves a level. A gain scales and, like a label,
#   leaves a product (`gain / length` is a plain per-length number); a level
#   has no products.
#
# A dimension with a kind has partial `*` and `/` (`Option`): a product with
# a point or a level has no result.
variants = ["Linear", "Absolute", "Affine", "Log"]
default = "Linear"
absolute = ["Absolute"]
affine = "Affine"
log = "Log"

[dim]
# `rad` is an exponent axis: angles multiply like exponents (rad² is the
# steradian, torque is J/rad), so rad/s never mixes with Hz, nor torque with
# energy. Where a textbook silently sets rad = 1 (s = r·θ, v = ω·r, τ = r × F,
# I = m·r²), the code divides by a radian explicitly.
fields = ["m", "kg", "s", "A", "K", "mol", "cd", "rad"]

# The base constants: the only raw numbers of the generated crate (its `base`
# module). One per axis - the unit of that axis, exponent 1 - plus the number
# one (the unit of dimension one: `HERTZ = ONE / SECOND`) and the zero of
# absolute temperature. Every other constant is defined from them: a coherent
# unit as their product (`NEWTON = METRE * KILOGRAM / (SECOND * SECOND)`), a
# multiple as `m * COHERENT` (`KILOMETRE = 1000.0 * METRE`).

[[base]]
name = "ONE"
doc = "The number one: the unit of dimension one."

[[base]]
name = "METRE"
dims = {m = 1}
doc = "The metre, the SI base unit of length."

[[base]]
name = "KILOGRAM"
dims = {kg = 1}
doc = "The kilogram, the SI base unit of mass."

[[base]]
name = "SECOND"
dims = {s = 1}
doc = "The second, the SI base unit of time."

[[base]]
name = "AMPERE"
dims = {A = 1}
doc = "The ampere, the SI base unit of electric current."

[[base]]
name = "KELVIN"
dims = {K = 1}
doc = "The kelvin as a step: a temperature difference of 1 K (the same as 1 °C of difference)."

[[base]]
name = "MOLE"
dims = {mol = 1}
doc = "The mole, the SI base unit of amount of substance."

[[base]]
name = "CANDELA"
dims = {cd = 1}
doc = "The candela, the SI base unit of luminous intensity."

[[base]]
name = "RADIAN"
dims = {rad = 1}
doc = "The radian: an exponent axis here, so an angle never mixes with a plain ratio."

[[base]]
name = "ABSOLUTE_ZERO"
dims = {K = 1}
kind = "Absolute"
value = "0.0"
doc = "Absolute zero, 0 K: the zero of thermodynamic temperature."

[[base]]
name = "BEL"
kind = "Log"
doc = "The bel: a gain of ten times in power. The unit of the logarithmic line."

[[base]]
name = "UNIX_EPOCH"
dims = {s = 1}
kind = "Affine"
value = "0.0"
doc = "The Unix epoch, 1970-01-01T00:00:00Z: the base zero of `Instant`. An instant is stored, printed and serialized as seconds from here; every other zero of the line is defined from it."

[[base]]
name = "WATT_LEVEL"
dims = {m = 2, kg = 1, s = -3}
kind = "Log"
value = "0.0"
doc = "The level of one watt, 0 dBW: where the numbers of a power level start."

[dimensionless]  # Ratio units, always present in lib.rs.
units = [
    {v = "Ratio", m = "1.0", s = "", l = ""},
    {v = "PartPerHundred", m = "0.01", s = "parts per hundred", l = "parts per hundred"},
    {v = "Percent", m = "0.01", s = "%", l = "percent"},
    {v = "PartPerThousand", m = "0.001", s = "parts per thousand", l = "parts per thousand"},
    {v = "PerMille", m = "0.001", s = "‰", l = "per mille"},
    {v = "PartPerTenThousand", m = "1.0e-4", s = "parts per ten thousand", l = "parts per ten thousand"},
    {v = "BasisPoint", m = "1.0e-4", s = "bp", l = "basis points"},
    {v = "PartPerMillion", m = "1e-06", s = "ppm", l = "parts per million"},
    {v = "PartPerBillion", m = "1e-09", s = "ppb", l = "parts per billion"},
    {v = "PartPerTrillion", m = "1e-12", s = "ppt", l = "parts per trillion"},
    {v = "PartPerQuadrillion", m = "1e-15", s = "ppq", l = "parts per quadrillion"},
]

