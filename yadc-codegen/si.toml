[[family.quantity]]
name = "Power"
dims = {m = 2, kg = 1, s = -3}
units = [
    {v = "Watt", m = "1.0", s = "W", l = "watts"},
    # Power levels, in `PowerUnit` with the watts: each is `by` a scale on the
    # logarithmic line (`PowerLevel`, below) and reads a `Power` `via` that
    # line - `level.rs`'s std `From` between the two - so the enum's dBm takes
    # 30 to one watt.
    {v = "DecibelWatt",      s = "dBW", l = "decibels-watt",      by = "DBW", via = "PowerLevel", non_const = true},
    {v = "DecibelMilliwatt", s = "dBm", l = "decibels-milliwatt", by = "DBM", via = "PowerLevel", non_const = true},
    {v = "ErgPerSecond", m = "1e-07", s = "erg/s", l = "ergs per second", c = false},
    {v = "FootPoundPerHour", m = "(0.3048 * 0.45359237 * 9.80665) / 3600.0", s = "ft · lbf/h", l = "foot pounds-force per hour", c = false},
    {v = "FootPoundPerMinute", m = "(0.3048 * 0.45359237 * 9.80665) / 60.0", s = "ft · lbf/min", l = "foot pounds-force per minute", c = false},
    {v = "FootPoundPerSecond", m = "0.3048 * 0.45359237 * 9.80665", s = "ft · lbf/s", l = "foot pounds-force per second", c = false},
    {v = "Horsepower", m = "550.0 * 0.3048 * 0.45359237 * 9.80665", s = "hp", l = "horsepower"},
    {v = "HorsepowerBoiler", m = "9809.5", s = "hp (S)", l = "horsepower (boiler)"},
    {v = "HorsepowerElectric", m = "746.0", s = "hp (E)", l = "horsepower (electric)"},
    {v = "HorsepowerMetric", m = "75.0 * 9.80665", s = "hp (M)", l = "metric horsepower"},
    {v = "HorsepowerImperial", m = "745.7", s = "hp (I)", l = "horsepower (Imperial)"},
    {v = "HydraulicHorsepower", m = "746.043", s = "hp (hydraulic)", l = "hydraulic horsepower"},
]

# A gain: the logarithm of a power ratio. The bel is ten times, the decibel a
# tenth of that, and the neper e² times (1 Np = 2 / ln 10 B ≈ 8.686 dB).
# `level.rs` converts to and from a plain ratio.
[[family.quantity]]
name = "Gain"
kind = "Log"
units = [
    {v = "Bel", m = "1.0", s = "B", l = "bels"},
    {v = "Decibel", m = "0.1", s = "dB", l = "decibels"},
    {v = "Neper", m = "0.8685889638065036", s = "Np", l = "nepers"},
]

# A power level: the logarithm of a power, so it carries power's exponents.
# Two levels differ by a gain (the exponents subtract: watts over watts) and a
# gain moves a level. Read on a scale - a zero and a step, like a temperature:
# dBW starts at one watt, dBm at one milliwatt, each step a decibel.
# `level.rs` converts to and from `Power`.
[[family.quantity]]
name = "PowerLevel"
dims = {m = 2, kg = 1, s = -3}
kind = "Log"
consts = [
    {name = "MILLIWATT_LEVEL", value = "WATT_LEVEL - DECIBEL * 30.0", doc = "The level of one milliwatt, 0 dBm: 30 dB below a watt."},
    {name = "DBW", ty = "Scale<PowerLevel, Gain>", value = "Scale(WATT_LEVEL, DECIBEL)", doc = "Decibels-watt (dBW): decibels from one watt. A unit of `PowerLevel`; the watts are `Power::from` away."},
    {name = "DBM", ty = "Scale<PowerLevel, Gain>", value = "Scale(MILLIWATT_LEVEL, DECIBEL)", doc = "Decibels-milliwatt (dBm): decibels from one milliwatt. A unit of `PowerLevel`; the watts are `Power::from` away."},
]
units = [
    {v = "DecibelWatt",      s = "dBW", l = "decibels-watt",      by = "DBW"},
    {v = "DecibelMilliwatt", s = "dBm", l = "decibels-milliwatt", by = "DBM"},
]

