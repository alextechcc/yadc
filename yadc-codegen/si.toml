# A point in time. There is one line of instants, counted in uniform seconds
# from the Unix epoch (leap seconds are not modelled); an instant is read on a
# scale - a zero and a step, like a temperature - and every scale reads the
# same line, so an instant built from GPS seconds reads in Unix seconds.
[[family.quantity]]
name = "Instant"
dims = {s = 1}
kind = "Affine"
consts = [
    {name = "GPS_EPOCH", value = "UNIX_EPOCH + SECOND * 315964800.0", doc = "The GPS epoch, 1980-01-06T00:00:00Z: 3657 days after the Unix epoch."},
    {name = "JULIAN_EPOCH", value = "UNIX_EPOCH - DAY * 2440587.5", doc = "The zero of the Julian date: noon on 1 January 4713 BC (proleptic Julian), 2 440 587.5 days before the Unix epoch."},
    {name = "MODIFIED_JULIAN_EPOCH", value = "UNIX_EPOCH - DAY * 40587.0", doc = "The zero of the modified Julian date, 1858-11-17T00:00:00Z: 40 587 days before the Unix epoch."},
    {name = "UNIX_SECONDS", ty = "Scale<Instant, Time>", value = "Scale(UNIX_EPOCH, SECOND)", doc = "Unix time: seconds from the Unix epoch."},
    {name = "UNIX_MILLISECONDS", ty = "Scale<Instant, Time>", value = "Scale(UNIX_EPOCH, MILLI * SECOND)", doc = "Unix time in milliseconds."},
    {name = "GPS_SECONDS", ty = "Scale<Instant, Time>", value = "Scale(GPS_EPOCH, SECOND)", doc = "GPS time: seconds from the GPS epoch."},
    {name = "JULIAN_DATE", ty = "Scale<Instant, Time>", value = "Scale(JULIAN_EPOCH, DAY)", doc = "The Julian date (JD): days from the Julian epoch."},
    {name = "MODIFIED_JULIAN_DATE", ty = "Scale<Instant, Time>", value = "Scale(MODIFIED_JULIAN_EPOCH, DAY)", doc = "The modified Julian date (MJD): days from the modified Julian epoch."},
]
units = [
    {v = "UnixSecond", s = "s Unix", l = "seconds of Unix time", by = "UNIX_SECONDS"},
    {v = "UnixMillisecond", s = "ms Unix", l = "milliseconds of Unix time", by = "UNIX_MILLISECONDS"},
    {v = "GpsSecond", s = "s GPS", l = "seconds of GPS time", by = "GPS_SECONDS"},
    {v = "JulianDate", s = "JD", l = "Julian date", by = "JULIAN_DATE"},
    {v = "ModifiedJulianDate", s = "MJD", l = "modified Julian date", by = "MODIFIED_JULIAN_DATE"},
]

