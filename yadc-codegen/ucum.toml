# The UCUM unit system for yadc-codegen: generated from ucum-essence.xml,
# with UCUM's own base units.
#
# The [ucum] table drives generation: families, quantities and units come
# from the XML, not from [[family]] sections here. Updating to a new UCUM
# release is changing the tag in [ucum].source and regenerating.
#
# UCUM's seven base units are the dimension's axes: the metre, the second,
# the gram, the radian, the kelvin, the coulomb and the candela. The mole is
# not one: UCUM defines it as a number, 6.0221367 x 10^23.

[system]
crate_name   = "yadc-ucum"
family_order = [
    "si", "heat", "iso1000", "intcust", "cgs",
    "infotech", "us", "british", "clinical", "constants", "misc",
]
unit_derives = ["Copy", "Clone", "PartialEq", "Eq", "Hash", "Debug"]

[kind]
# `Absolute`: an amount with a true zero that is also read on scales with
# other zeros - a temperature (kelvins, °C, °F). Two of them differ by a
# linear amount and a linear amount moves one.
variants = ["Linear", "Absolute"]
default = "Linear"
absolute = ["Absolute"]

# UCUM's base units, one axis each.
[dim]
fields = ["m", "s", "g", "rad", "K", "C", "cd"]

# The base constants: the only raw numbers of the generated crate (its `base`
# module). One per axis - the unit of that axis, exponent 1 - plus the number
# one (the unit of dimension one: `HERTZ = ONE / SECOND`) and the zero of
# absolute temperature. Every other constant is defined from them.

[[base]]
name = "ONE"
doc = "The number one: the unit of dimension one."

[[base]]
name = "METRE"
dims = {m = 1}
doc = "The metre, UCUM's base unit of length."

[[base]]
name = "SECOND"
dims = {s = 1}
doc = "The second, UCUM's base unit of time."

[[base]]
name = "GRAM"
dims = {g = 1}
doc = "The gram, UCUM's base unit of mass."

[[base]]
name = "RADIAN"
dims = {rad = 1}
doc = "The radian, UCUM's base unit of plane angle."

[[base]]
name = "KELVIN"
dims = {K = 1}
doc = "The kelvin as a step, UCUM's base unit of temperature: a difference of 1 K."

[[base]]
name = "COULOMB"
dims = {C = 1}
doc = "The coulomb, UCUM's base unit of electric charge."

[[base]]
name = "CANDELA"
dims = {cd = 1}
doc = "The candela, UCUM's base unit of luminous intensity."

[[base]]
name = "ABSOLUTE_ZERO"
dims = {K = 1}
kind = "Absolute"
value = "0.0"
doc = "Absolute zero, 0 K: the zero of thermodynamic temperature."

[dimensionless]
units = [
    {v = "Ratio", m = "1.0", s = "", l = ""},
]

# --- UCUM source -------------------------------------------------------------

[ucum]
# A release's ucum-essence.xml, pinned by its tag: the generated crate is the
# same for the same source. "latest" asks GitHub for the newest release; a
# file path reads a local copy.
source = "https://raw.githubusercontent.com/ucum-org/ucum/v2.2/ucum-essence.xml"
