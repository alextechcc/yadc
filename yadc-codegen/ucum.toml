# UCUM-mode unit system definition for yadc-codegen.
#
# The [ucum] table triggers UCUM-driven generation: families and quantities
# come from ucum-essence.xml rather than [[family]] sections in this file.
#
# Angles are a real exponent axis (`rad`, so sr = rad2), as in yadc-si.
# To use UCUM-native dimensions instead of ISQ (`g` as grams, `C` as
# coulombs): change [dim].fields to ["m", "g", "s", "C", "K", "cd", "rad"] and
# remove or remap the [[ucum.base]] entries for g and C.

[system]
crate_name   = "yadc-ucum"
family_order = [
    "si", "heat", "iso1000", "intcust", "cgs",
    "infotech", "us", "british", "clinical", "constants", "misc",
]
unit_derives = ["Copy", "Clone"]

[kind]
# `Absolute`: a temperature - an amount with a true zero that scales with
# other zeros also read. Two differ by a linear step, and a step moves one.
variants = ["Linear", "Absolute"]
default = "Linear"
rules = { Absolute = ["sub(Absolute) = Linear", "add(Linear) = Absolute", "sub(Linear) = Absolute"] }

# ISQ dimension fields.  Change this list (and the [[ucum.base]] overrides
# below) to switch to a different basis, e.g. native UCUM dimensions.
[dim]
fields = ["m", "kg", "s", "A", "K", "mol", "cd", "rad"]

# The base constants: the only raw numbers of the generated crate (its `base`
# module). One per axis - the unit of that axis, exponent 1 - plus the number
# one (the unit of dimension one: `HERTZ = ONE / SECOND`) and the zero of
# absolute temperature. Every other constant is defined from them: a coherent
# unit as their product (`NEWTON = METRE * KILOGRAM / (SECOND * SECOND)`), a
# multiple as `m * COHERENT` (`KILOMETRE = 1000.0 * METRE`).

[[base]]
name = "ONE"
doc = "The number one: the unit of dimension one."

[[base]]
name = "METRE"
dims = {m = 1}
doc = "The metre, the SI base unit of length."

[[base]]
name = "KILOGRAM"
dims = {kg = 1}
doc = "The kilogram, the SI base unit of mass."

[[base]]
name = "SECOND"
dims = {s = 1}
doc = "The second, the SI base unit of time."

[[base]]
name = "AMPERE"
dims = {A = 1}
doc = "The ampere, the SI base unit of electric current."

[[base]]
name = "KELVIN"
dims = {K = 1}
doc = "The kelvin as a step: a temperature difference of 1 K (the same as 1 °C of difference)."

[[base]]
name = "MOLE"
dims = {mol = 1}
doc = "The mole, the SI base unit of amount of substance."

[[base]]
name = "CANDELA"
dims = {cd = 1}
doc = "The candela, the SI base unit of luminous intensity."

[[base]]
name = "RADIAN"
dims = {rad = 1}
doc = "The radian: an exponent axis here, so an angle never mixes with a plain ratio."

[[base]]
name = "ABSOLUTE_ZERO"
dims = {K = 1}
kind = "Absolute"
value = "0.0"
doc = "Absolute zero, 0 K: the zero of thermodynamic temperature."

[dimensionless]
units = [
    {v = "Ratio", m = "1.0", s = "", l = ""},
]

# --- UCUM source -------------------------------------------------------------

[ucum]
# "latest"  -> query the GitHub releases API and fetch that tag's ucum-essence.xml
# URL       -> fetch the file at this address directly
# file path -> read a local copy (pinned version, offline use)
source = "latest"

# --- Base-unit remapping -----------------------------------------------------
#
# Each [[ucum.base]] entry overrides how one UCUM base-unit code is seeded in
# the resolver.  Omitted base units default to self-seeding (the code becomes
# its own dim field with exponent 1 and multiplier 1.0).
#
# UCUM base units: m  s  g  C  K  cd  rad  (7 total, different from ISQ)
# ISQ base units:  m  s  kg A  K  cd  mol  (7 total)
#
# The five entries below perform the ISQ remapping.
# m, s, K, cd map 1:1 and are handled by self-seeding.

[[ucum.base]]
# gram -> kilogram  (UCUM uses gram; ISQ uses kilogram)
code       = "g"
dims       = { kg = 1 }
multiplier = 1e-3

[[ucum.base]]
# coulomb -> ampere*second  (UCUM uses charge C; ISQ uses current A)
# C = A*s, so 1 C expressed in ISQ base units has dim {A=1, s=1} x 1.0
code       = "C"
dims       = { A = 1, s = 1 }
multiplier = 1.0

[[ucum.base]]
# mole - override UCUM's Avogadro-count interpretation and treat as ISQ base.
# UCUM defines mol = 6.022x10^2^3 (a dimensionless count); this entry promotes
# it to a proper SI base dimension, consistent with ISQ/SI.
code       = "mol"
dims       = { mol = 1 }
multiplier = 1.0

