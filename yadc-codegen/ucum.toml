# The UCUM unit system for yadc-codegen: generated from ucum-essence.xml,
# with UCUM's own base units.
#
# The [ucum] table drives generation: families, quantities and units come
# from the XML, not from [[family]] sections here. Updating to a new UCUM
# release is changing the tag in [ucum].source and regenerating.
#
# UCUM's seven base units are the dimension's axes: the metre, the second,
# the gram, the radian, the kelvin, the coulomb and the candela. The mole is
# not one: UCUM defines it as a number, 6.02214076 x 10^23.

[system]
crate_name   = "yadc-ucum"
family_order = [
    "si", "heat", "iso1000", "intcust", "cgs",
    "infotech", "us", "british", "clinical", "constants", "misc",
]
unit_type    = "UcumUnit"
unit_derives = ["Copy", "Clone", "PartialEq", "Eq", "Hash", "Debug"]

# UCUM's base units, one axis each.
[dim]
fields = ["m", "s", "g", "rad", "K", "C", "cd"]

[dimensionless]
units = [
    {v = "Ratio", m = "1.0", s = "", l = ""},
]

# --- UCUM source -------------------------------------------------------------

[ucum]
# A release's ucum-essence.xml, pinned by its tag: the generated crate is the
# same for the same source. "latest" asks GitHub for the newest release; a
# file path reads a local copy.
source = "https://raw.githubusercontent.com/ucum-org/ucum/v2.2/ucum-essence.xml"
