[package]
name = "yadc-ucum"
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"

[dependencies]
const_derive_more = { path = "../const_derive_more" }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[features]
default = [
    "std",
    "si",
    "heat",
    "iso1000",
    "intcust",
    "cgs",
    "infotech",
    "us",
    "british",
    "clinical",
    "constants",
    "misc",
]
std = ["num-traits/std", "serde?/std"]
# Software float math for a `no_std` build: `Real` (and so the log unit
# conversions) needs either this or `std`.
libm = ["num-traits/libm"]
si = []
heat = []
iso1000 = []
intcust = []
cgs = []
infotech = []
us = []
british = []
clinical = []
constants = []
misc = []
serde = ["dep:serde"]
