[package]
name = "yadc-si"
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"

[dependencies]
yadc = { path = "../yadc", default-features = false }
dynamickit = { path = "../dynamickit" }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
uom = { version = "0.38.0", features = ["si", "f64"], optional = true }
typenum = { version = "1", optional = true }

[features]
default = [
    "std",
    "mechanical",
    "angular",
    "electromagnetic",
    "thermal",
    "fluid",
    "density",
    "chemistry",
    "photometric",
    "information",
]
std = ["yadc/std", "serde?/std"]
# Software float math for a `no_std` build: `Real` (and so the nonlinear
# unit conversions) needs either this or `std`.
libm = ["yadc/libm"]
mechanical = []
angular = []
electromagnetic = []
thermal = []
fluid = []
density = []
chemistry = []
photometric = []
information = []
# `alloc`: the UCUM (de)serializers build owned `String`s.
serde = ["dep:serde", "serde/alloc", "yadc/ucum"]
uom = ["dep:uom", "dep:typenum"]

[[test]]
name = "uom_bridge"
required-features = ["uom", "mechanical", "angular", "thermal"]

# The integration tests use most families.
[[test]]
name = "integration"
required-features = ["mechanical", "angular", "electromagnetic", "thermal", "fluid", "chemistry"]

# Unit `Display` / `FromStr`, a kindless dimension, a generic value type.
[[test]]
name = "units"
required-features = ["mechanical"]

[[test]]
name = "sets"
required-features = ["mechanical", "thermal"]

# A settings menu: a closed set of quantities and the set of their units,
# visited and listed with `dynamickit`.
[[example]]
name = "sets"
required-features = ["mechanical", "thermal"]

# The open type: `DynamicSIQuantity` arithmetic decided at run time.
[[example]]
name = "open"
required-features = ["mechanical", "thermal"]

# A reading that keeps its unit: a closed set of (quantity, unit) pairs.
[[example]]
name = "measurement"
required-features = ["mechanical"]
