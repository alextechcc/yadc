[package]
name = "yadc-si"
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"
description = "An SI unit system built with yadc: quantities, units and physical constants, static and dynamic."

[dependencies]
const_derive_more = { path = "../const_derive_more" }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
uom = { version = "0.38.0", features = ["si", "f64"], optional = true }
typenum = { version = "1", optional = true }

[features]
default = [
    "std",
    "mechanical",
    "angular",
    "electromagnetic",
    "thermal",
    "fluid",
    "density",
    "chemistry",
    "photometric",
    "information",
]
std = ["num-traits/std", "serde?/std"]
# Software float math for a `no_std` build: `Real` (and so the log units'
# conversions) needs either this or `std`.
libm = ["num-traits/libm"]
mechanical = []
angular = []
electromagnetic = []
thermal = []
fluid = []
density = []
chemistry = []
photometric = []
information = []
serde = ["dep:serde"]
uom = ["dep:uom", "dep:typenum"]

[[test]]
name = "uom_bridge"
required-features = ["uom", "mechanical", "angular", "thermal"]

# The integration tests use most families.
[[test]]
name = "integration"
required-features = ["mechanical", "angular", "electromagnetic", "thermal", "fluid", "chemistry"]

# Unit `Display` / `FromStr`, a unit of a user's own, generic number types.
[[test]]
name = "units"
required-features = ["mechanical"]

[[test]]
name = "sets"
required-features = ["mechanical", "thermal"]

# A settings menu: a closed set of quantities and the set of their units,
# visited and listed with `const_derive_more`.
[[example]]
name = "sets"
required-features = ["mechanical", "thermal"]

# The open type: `DynamicSIQuantity` arithmetic decided at run time.
[[example]]
name = "open"
required-features = ["mechanical", "thermal"]

# A reading that keeps its unit: a closed set of (quantity, unit) pairs.
[[example]]
name = "measurement"
required-features = ["mechanical"]
