[package]
name = "yadc-math"
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"
description = "The generic maths under yadc: dimensions, partial powers and roots, typed powers and roots, rational exponents, number casts."

[dependencies]
libm = { version = "0.2", optional = true }

[features]
default = ["std"]
# `PartialRoot` for `f32` / `f64` needs `powf`: from std, or in `no_std` from libm.
std = []
libm = ["dep:libm"]
