[package]
name = "yadc-derive"
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"
description = "The derive macros of yadc (Dimension, Quantity, Unit and the UCUM serde derives). Depend on yadc instead."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
