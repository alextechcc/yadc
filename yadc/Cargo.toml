[package]
name = "yadc"
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"
description = "Compile-time-checked unit systems as a pattern: system crates generated by yadc-codegen, their operators lifted by const_derive_more."

[dev-dependencies]
const_derive_more = { path = "../const_derive_more" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uom = "0.38.0"
yadc-si = { path = "../yadc-si", features = ["serde", "uom"] }
