[package]
name = "yadc"
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"
description = "Dimensional analysis on your own types: the traits and derives for a unit system you define, checked at compile time."

[dependencies]
yadc-derive = { path = "../yadc-derive" }
yadc-math = { path = "../yadc-math", default-features = false }
num-traits = { version = "0.2", default-features = false }

[features]
default = ["std"]
std = ["num-traits/std", "yadc-math/std"]
libm = ["num-traits/libm", "yadc-math/libm"]
# The UCUM string form of a dimension's kind (`yadc::ucum::UcumKind`) and the
# `UcumKind` / `UcumSerialize` / `UcumDeserialize` derives - the serde add-on.
ucum = []

[dev-dependencies]
dynamickit = { path = "../dynamickit" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uom = "0.38.0"
yadc-si = { path = "../yadc-si", features = ["serde", "uom"] }
